<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient: Deep Royal Indigo & Slate Navy -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Outer Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Graduation Cap Top Surface -->
    <linearGradient id="capTopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>

    <!-- Skull Cap Base Gradient -->
    <linearGradient id="capBaseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c7d2fe" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Golden Tassel Radiant Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#6366f1" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Container Badge (Ensures Crisp Contrast on Both Light & Dark Browser Tabs) -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Graduation Cap -->
  <g filter="url(#glow)">
    <!-- Skullcap Lower Band -->
    <path d="M20 33.5 V40 C20 46.5 44 46.5 44 40 V33.5 C39 37 25 37 20 33.5 Z" fill="url(#capBaseGrad)" />

    <!-- Cap Diamond 3D Underside Rim -->
    <path d="M11 25.5 L32 36 L53 25.5 L53 28 L32 38.5 L11 28 Z" fill="#6366f1" />

    <!-- Cap Diamond Top Plate -->
    <path d="M32 14.5 L53 25.5 L32 36.5 L11 25.5 Z" fill="url(#capTopGrad)" />
  </g>

  <!-- Golden Center Button -->
  <circle cx="32" cy="25.5" r="2.75" fill="url(#goldGrad)" />

  <!-- Golden Tassel Cord -->
  <path d="M32 25.5 C39 25.5 49.5 27 50.5 31" fill="none" stroke="url(#goldGrad)" stroke-width="2.2" stroke-linecap="round" />

  <!-- Golden Tassel Band & Brush -->
  <circle cx="50.5" cy="32" r="1.8" fill="#f59e0b" />
  <path d="M48.8 33 H52.2 L53.5 43.5 C53.5 45 47.5 45 47.5 43.5 Z" fill="url(#goldGrad)" />

  <!-- Intelligent Computing & AI Circuit Nodes -->
  <path d="M25 52.5 H39" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" stroke-linecap="round" />
  <circle cx="25" cy="52.5" r="1.6" fill="#38bdf8" />
  <circle cx="32" cy="52.5" r="2.2" fill="#fbbf24" />
  <circle cx="39" cy="52.5" r="1.6" fill="#38bdf8" />
</svg>